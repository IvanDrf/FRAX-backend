<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Добавление фактора риска FRAX</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
  <div class="phone-frame">
    <main class="tabbed-page">
      <header class="page-header">
        <span class="frax-badge">FRAX</span>
        <h1 class="page-title">
          {% if factor %}Публикация фактора{% else %}Новый фактор{% endif %}
        </h1>
      </header>

      {% if not factor %}
      <form method="post" action="/add">
        <section class="minio-block">
          <h2>Изображение</h2>
          <img class="minio-preview" alt="Изображение по умолчанию" src="/static/img/default.png" />
          <label class="file-field-custom">
            <input type="file" accept="image/*" aria-label="Изображение" />
            <span class="file-button">Выбрать файл</span>
            <span class="file-name">Файл не выбран</span>
          </label>
        </section>

        <section class="minio-block">
          <h2>Видео</h2>
          <video class="minio-preview" controls preload="metadata" playsinline src="/static/video/default.mp4"></video>
          <label class="file-field-custom">
            <input type="file" accept="video/*" aria-label="Видео" />
            <span class="file-button">Выбрать файл</span>
            <span class="file-name">Файл не выбран</span>
          </label>
        </section>

        <label class="field-label" for="name">Название фактора</label>
        <input class="factor-field" id="name" name="name" type="text" placeholder="Например, Курение" required />

        <button class="next-button" type="submit">Далее</button>
      </form>
      {% endif %}

      {% if factor %}
      <form method="post" action="/add/publish">
        <section class="minio-block">
          <h2>Изображение</h2>
          <img class="minio-preview" src="{{ factor.image_url or '/static/img/default.png' }}"
            alt="{{ factor.name }}" />
        </section>

        <section class="minio-block">
          <h2>Видео</h2>
          <video class="minio-preview" src="{{ factor.video_url or '/static/video/default.mp4' }}" controls
            preload="metadata" playsinline></video>
        </section>

        <input type="hidden" name="name" value="{{ factor.name }}" />
        <input type="hidden" name="image_url" value="{{ factor.image_url or '/static/img/default.png' }}" />
        <input type="hidden" name="video_url" value="{{ factor.video_url or '/static/video/default.mp4' }}" />

        <label class="field-label" for="description">Краткое описание фактора</label>
        <textarea class="factor-field" id="description" name="description" required
          placeholder="Краткое описание фактора риска">{{ factor.description }}</textarea>

        <label class="field-label" for="weight">Вес фактора</label>
        <input class="factor-field" id="weight" name="weight" type="number" step="0.1" min="0" max="2"
          value="{{ factor.weight }}" required />

        <label class="field-label" for="prevalence">Распространённость фактора, %</label>
        <input class="factor-field" id="prevalence" name="prevalence" type="number" step="1" min="0" max="100"
          value="{{ factor.prevalence or 0 }}" required />

        <label class="field-label" for="category">Категория фактора</label>
        <select class="factor-field" id="category" name="category" required>
          <option value="Бинарный" {% if factor.category.value=='Бинарный' %}selected{% endif %}>Бинарный (да/нет)
          </option>
          <option value="Числовой" {% if factor.category.value=='Числовой' %}selected{% endif %}>Числовой</option>
          <option value="Категориальный" {% if factor.category.value=='Категориальный' %}selected{% endif %}>
            Категориальный</option>
        </select>

        <button class="next-button" type="submit">Опубликовать</button>
      </form>
      {% endif %}
    </main>

    <nav class="tab-panel">
      <a class="tab-button" href="/reels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none" />
        </svg>
        Лента
      </a>
      <a class="tab-button" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        Каталог
      </a>
      <a class="tab-button active" href="/add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v8M8 12h8" />
        </svg>
        Добавление
      </a>
    </nav>
  </div>
</body>

</html>
